name: omniquant-seq
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - sra-tools=3.4.1
  - fastqc=0.12.1
  - multiqc=1.14
  - bbmap=39.81
  - star=2.7.10a
  - rsem=1.3.3
  - openpyxl=3.1.5
  - wget=1.25.0
  # multiqc 1.14 still imports pkg_resources; setuptools>=81 dropped it and
  # breaks `multiqc --version`/report generation with ModuleNotFoundError.
  - setuptools<81
